name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # The checked-out commit SHA is the Pages build ID: Vite embeds it in the
      # JavaScript and writes the same value to dist/version.json, which the
      # running app compares with to detect a stale client (Issue #131).
      - name: Build
        run: npm run build
        env:
          VITE_APP_BUILD_ID: ${{ github.sha }}

      - name: Verify version manifest
        run: |
          test "$(node -p "require('./dist/version.json').buildId")" = "$GITHUB_SHA"
          grep -rqF "$GITHUB_SHA" dist/assets

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
